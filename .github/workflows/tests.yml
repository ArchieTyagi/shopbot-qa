# GitHub Actions: runs ALL tests automatically every time you push code.
# This is the CI/CD "guard at the door".

name: Run tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run all tests
        env:
          # Add your key in GitHub: Settings > Secrets and variables > Actions > New secret.
          # Without it, the chatbot runs in simple rules mode and the AI-only tests are skipped.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: pytest

      - name: Save the app logs (useful when a test fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-logs
          path: logs/app.log